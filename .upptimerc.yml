# The public status page for SeeWhoCares (autonoME), at https://status.seewhocares.com
# Pilot readiness item 2 (PRO-91). Checks run on GitHub Actions; the page is served by GitHub Pages,
# so it stays up when AWS does not.
owner: seewhocares
repo: status

sites:
  - name: API
    url: https://api.seewhocares.com/status/health
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Web app
    url: https://app.seewhocares.com
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000

# An outage opens an issue here, assigned to the owner; it shows on the page as an incident.
assignees:
  - jasondavey

status-website:
  cname: status.seewhocares.com
  logoUrl: https://raw.githubusercontent.com/seewhocares/status/master/assets/autonome-logo.jpg
  favicon: https://raw.githubusercontent.com/seewhocares/status/master/assets/favicon.svg
  faviconSvg: https://raw.githubusercontent.com/seewhocares/status/master/assets/favicon.svg
  name: autonoME status
  introTitle: "**autonoME** service status"
  introMessage: Live status of the autonoME API and web app, checked every five minutes from outside our hosting. Problems are also reported to you by email under our support policy. Questions? Write to [support@seewhocares.com](mailto:support@seewhocares.com).
  navbar:
    - title: Status
      href: /
    - title: Support
      href: https://www.seewhocares.com/contact
